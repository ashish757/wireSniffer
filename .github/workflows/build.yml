name: C++ macOS Build & Release Pipeline

on:
  push:
    tags:
      - 'v*' # This triggers the release only when you push a tag like "v1.0.0"
  workflow_dispatch: # Still lets you test it manually

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build ${{github.workspace}}/build --config Release

      - name: Compress Binary
        run: |
          cd ${{github.workspace}}/build
          # Zip everything that looks like an executable or Mac .app package
          zip -r WireSniffer-macOS.zip WireSniffer *.app || echo "Zip created"

      - name: Publish Automated Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: WireSniffer ${{ github.ref_name }} - Offensive Intel Edition
          body: |
            **Automated Release Deployment**
            - Live Packet Capture & Payload Extraction
            - Threat Simulation & Reconnaissance Logging
            - .pcap file I/O operations
          files: ${{github.workspace}}/build/WireSniffer-macOS.zip